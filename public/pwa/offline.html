<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>You're offline</title>
    <style>
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #F7F7FB; color: #14141B;
               font-family: system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; padding: 24px; }
        .card { max-width: 320px; }
        .dot { width: 46px; height: 46px; margin: 0 auto 16px; border-radius: 14px; background: #EEF0FF; color: #4F46E5;
               display: grid; place-items: center; font-size: 22px; }
        h1 { font-size: 18px; margin: 0 0 6px; }
        p { font-size: 14px; line-height: 1.5; color: #6B6B78; margin: 0 0 18px; }
        button { border: 0; background: #4F46E5; color: #fff; font-weight: 600; font-size: 14px;
                 padding: 10px 18px; border-radius: 10px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <div class="dot">⚡</div>
        <h1>You're offline</h1>
        <p>Is page ko dikhane ke liye internet chahiye. Connection wapas aate hi dobara try karein.</p>
        <button onclick="location.reload()">Try again</button>
    </div>
</body>
</html>
